<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الرخصة المهنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: single centered column (max 760px), sticky top bar, card stack; RTL throughout */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#e8f1f4; --line:#dcdedf;
  --ink:#15445a; --text:#1d3442; --muted:#5e7480;
  --brand:#15445a; --brand-2:#3d7eb9; --teal:#0da9a6; --teal-soft:#dcf2f1;
  --good:#07a869; --good-soft:#dff4ea; --bad:#c2413b; --bad-soft:#fbe8e6;
  --warn-soft:#f5f1e6; --warn-line:#c1b489; --on-brand:#ffffff; --sand:#c1b489; --grey:#c2c1c1;
  --hero-a:#15445a; --hero-b:#3d7eb9; --hero-c:#0da9a6;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1b23; --surface:#122833; --surface-2:#183441; --line:#25404d;
  --ink:#e4eef2; --text:#d6e3e8; --muted:#97adb7; --brand:#6fb0e0; --brand-2:#3d7eb9; --teal:#3fcfcb; --teal-soft:#123a3c;
  --good:#3fd193; --good-soft:#12352a; --bad:#f08a83; --bad-soft:#3a1d1c; --warn-soft:#2a2719; --warn-line:#8a7f57; --on-brand:#0c1b23;
  --hero-a:#123a4d; --hero-b:#2d6699; --hero-c:#0b8c8a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1b23; --surface:#122833; --surface-2:#183441; --line:#25404d;
  --ink:#e4eef2; --text:#d6e3e8; --muted:#97adb7; --brand:#6fb0e0; --brand-2:#3d7eb9; --teal:#3fcfcb; --teal-soft:#123a3c;
  --good:#3fd193; --good-soft:#12352a; --bad:#f08a83; --bad-soft:#3a1d1c; --warn-soft:#2a2719; --warn-line:#8a7f57; --on-brand:#0c1b23;
  --hero-a:#123a4d; --hero-b:#2d6699; --hero-c:#0b8c8a;
  color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;color:var(--brand);font-size:1.1rem;background:none;border:0;cursor:pointer;padding:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.iconbtn{width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover,.iconbtn[aria-expanded="true"]{background:var(--surface-2);color:var(--brand)}
nav.menu{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-6px;padding-block:0 8px}
nav.menu::-webkit-scrollbar{display:none}
nav.menu button{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;padding:9px 13px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:500 .95rem var(--body);cursor:pointer;position:relative}
nav.menu button svg.i{width:18px;height:18px}
nav.menu button.on{background:var(--surface-2);color:var(--brand);font-weight:700}
nav.menu button.on::after{content:"";position:absolute;inset:auto 13px -8px;height:3px;border-radius:3px 3px 0 0;background:var(--teal)}
nav.menu button:hover{background:var(--surface-2);color:var(--ink)}
.toprow{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;padding-top:10px}
.toprow .brand{order:1;font-size:1.02rem}
.toprow #themeBtn{order:2;margin-inline-start:auto}
.toprow nav.menu{order:3;flex-basis:100%;margin-top:8px}
@media (min-width:900px){
  header.top .wrap{max-width:1180px}
  .toprow{flex-wrap:nowrap;padding-block:10px}
  .toprow .brand{order:0;flex:none;font-size:1.1rem}
  .toprow nav.menu{order:0;flex:1 1 auto;flex-basis:auto;justify-content:center;margin:0;padding:0}
  .toprow #themeBtn{order:0;margin-inline-start:0;flex:none}
  nav.menu button.on::after{bottom:-11px}
}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{color:var(--ink);font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(1.6rem,4.6vw,2.1rem)}
h2{font-size:1.05rem;color:var(--muted);font-weight:600}
p{margin:0}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 26px;color:#fff;background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 60%,var(--hero-c) 100%);box-shadow:0 14px 30px -18px rgba(21,68,90,.6)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.16);pointer-events:none}
.hero::before{width:420px;height:420px;left:-160px;top:-40px}
.hero::after{width:300px;height:300px;left:-60px;top:60px;background:rgba(255,255,255,.04)}
.hero>*{position:relative}
.hero .eyebrow{font-weight:700;font-size:.95rem;opacity:.95}
.hero .school{opacity:.85;font-size:.92rem}
.hero h1{margin-block:6px 6px;color:#fff}
.hero .principal{opacity:.85;font-size:.92rem}
.hero p.lead{opacity:.9}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 20px;font:600 1rem var(--body);cursor:pointer;border:1px solid transparent;text-decoration:none}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn-light{background:#fff;color:#15445a}
.btn-ghost-light{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-2)}
.btn-outline{background:var(--surface);color:var(--brand);border-color:var(--line)}
.btn-outline:hover{border-color:var(--brand)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:16px;padding:14px 16px;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding-block:16px 32px;gap:18px}
  .hero{padding:24px 18px;border-radius:22px}
  .hero .acts .btn{flex:1 1 140px}
  .card{padding:16px}
  .qtext{font-size:1.08rem}
  .opt{padding:12px}
  .qnav .btn{flex:1}
  .ring{width:130px;height:130px}
  th,td{padding:8px 6px;font-size:.88rem}
  .countnum input{width:72px}
}
.badge{width:48px;height:48px;border-radius:14px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;margin-bottom:12px}
.card h3{font-size:1.08rem;margin-bottom:2px}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chead .badge{margin:0;flex:none;width:44px;height:44px}
.chead h3{margin:0}
.card .sub{color:var(--muted);font-size:.93rem}
.card .btn{margin-top:14px}
.feature{display:flex;flex-direction:column}
.feature .btn{align-self:center;margin-top:auto;min-width:120px}
.feature .sub{margin-bottom:14px}
.stat{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.2}
.crumbs{font-size:.88rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;font:inherit;cursor:pointer}
.back{align-self:flex-start;background:var(--surface-2);color:var(--brand);border:0}
.spec{display:flex;align-items:center;gap:14px;text-align:right;width:100%;cursor:pointer;font:inherit;color:inherit}
.spec .badge{margin:0;width:44px;height:44px;flex:none}
.spec .t{flex:1;min-width:0}
.spec .n{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.spec:hover{border-color:var(--brand)}
.counts{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font:600 1rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.selectbox{position:relative}
.selectbox select{appearance:none;-webkit-appearance:none;width:100%;font:600 1.02rem var(--body);padding:14px 16px 14px 48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.selectbox select:hover{border-color:var(--teal)}
.selectbox::after{content:"";position:absolute;left:18px;top:50%;width:10px;height:10px;border-left:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);transform:translateY(-70%) rotate(-45deg);pointer-events:none}
.countrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.countrow input[type=range]{flex:1;min-width:180px;accent-color:var(--teal);height:28px}
.countnum{display:flex;align-items:center;gap:8px}
.countnum input{width:84px;text-align:center;font:700 1.25rem var(--display);padding:8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;direction:ltr}
.field input{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .25s}
.qtext{font-family:var(--display);font-size:1.18rem;font-weight:600;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex:none;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--surface-2)}
.opt.sel .k{background:var(--brand);color:var(--on-brand)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--on-brand)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--on-brand)}
.opt[disabled]{cursor:default}
.ltr{direction:ltr;unicode-bidi:plaintext}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.95rem}
.why b{color:var(--teal)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.star{border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;font:inherit;font-size:.9rem;padding:4px}
.star.on{color:#d39a1a}
.star.on svg{fill:#d39a1a;stroke:#d39a1a}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.ring{width:150px;height:150px;margin:0 auto}
.result-top{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:600;font-size:.9rem}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--warn-soft);color:var(--ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.rev{border-right:4px solid var(--line);padding-right:14px}
.rev.ok{border-right-color:var(--good)}
.rev.no{border-right-color:var(--bad)}
.rev .q{font-weight:600}
.rev .a{font-size:.93rem;color:var(--muted)}
.rev .a b{color:var(--ink)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.94rem}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.search{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
details.bq{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.bq summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none}
details.bq summary::-webkit-details-marker{display:none}
details.bq .body{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.ans{color:var(--good);font-weight:600}
footer{border-top:1px solid var(--line);background:var(--surface);text-align:center;padding-block:22px;color:var(--muted);font-size:.9rem}
footer strong{color:var(--ink);font-family:var(--display)}
footer .credit{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line);font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap toprow">
    <button class="brand" id="homeBtn" type="button"><span class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span>منصة الرخصة المهنية</button>
    <nav class="menu" id="menu" aria-label="القائمة الرئيسية"></nav>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الليلي"><svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap stack" style="gap:6px">
    <strong>الطفولة المبكرة بابتدائية الحادية عشر بعد المائة</strong>
    <span>مديرة المدرسة: فاطمة مسيري</span>
    <span>تنبيه: جميع الأسئلة تدريبية وتجريبية وليست أسئلة رسمية للاختبار.</span>
    <span class="credit">تصميم: هدى الشيخي</span>
  </div>
</footer>

<script>
/* ---------- Icons ---------- */
const I = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  book:'<path d="M12 6c-2-1.5-5-2-8-1.5V19c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5c-3-.5-6 0-8 1.5z"/><path d="M12 6v14.5"/>',
  test:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/>',
  bank:'<path d="M4 4v16M8 4v16"/><path d="M12 5l4-1 4 16-4 1z"/>',
  star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
  alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  school:'<path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5"/><circle cx="12" cy="11" r="1.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  child:'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v6M8 10l4 2 4-2M9 21l3-7 3 7"/>',
  abc:'<path d="M4 18l4-12 4 12M5.5 14h5"/><path d="M15 6v12h3a3 3 0 000-6h-3"/>',
  moon:'<path d="M12 3a7 7 0 100 18c-4-2-6-5.5-6-9s2-7 6-9z"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7 15h10"/>',
  atom:'<circle cx="12" cy="12" r="1.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/>',
  leaf:'<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"/><path d="M5 19l8-8"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  pc:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  brush:'<path d="M14 4l6 6-8 8H6v-6z"/><path d="M4 20l2-2"/>',
  run:'<circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-3 4 1 3 3 3-1"/>',
  home2:'<path d="M4 10l8-6 8 6v10H4z"/><path d="M9 20v-6h6v6"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
  talk:'<path d="M4 5h16v11H9l-5 4z"/>',
  en:'<path d="M4 6h7M4 12h6M4 18h7M4 6v12"/><path d="M14 18v-8l6 8v-8"/>',
  star2:'<path d="M12 3l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"/>'
};
const ic = (n,extra='') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${I[n]}</svg>`;

/* ---------- Question bank (original practice questions) ---------- */
/* format: [question, [options], correctIndex, explanation] */

function bindFlow(){
  const g=$('#pickGeneral'); if(g) g.onclick=()=>{ flow.spec='general'; flow.step='setup'; render(); };
  const s=$('#pickSpec'); if(s) s.onclick=()=>{ flow.spec=''; flow.step='setup'; render(); };
  const t=$('#toType'); if(t) t.onclick=()=>{ flow.step='type'; render(); };
  const sel=$('#specSel'); if(sel) sel.onchange=()=>{ flow.spec=sel.value; $('#pickWarn').hidden=true; upd(); };
  const r=$('#countRange'), n=$('#countNum');
  function upd(){
    const sp = ALL.find(x=>x.id===flow.spec), avail = sp?sp.q.length:0;
    const note=$('#countNote'); if (note){ note.hidden = !(sp && flow.count>avail); note.textContent = sp?`المتاح حاليًا في هذا المسار ${avail} سؤالًا، وستظهر لكِ جميعها بترتيب عشوائي.`:''; }
    const tn=$('#timeNote'); if (tn && flow.mode==='tests') tn.innerHTML = `الوقت المتاح: <b>${sp?Math.min(flow.count,avail):flow.count}</b> دقيقة (دقيقة لكل سؤال).`;
  }
  if (r){
    r.oninput=()=>{ flow.count=+r.value; n.value=r.value; upd(); };
    n.onchange=()=>{ let v=Math.round(+n.value||10); v=Math.max(10,Math.min(100,v)); flow.count=v; n.value=v; r.value=v; upd(); };
  }
  const st=$('#startQuiz'); if(st) st.onclick=()=>{
    const sp=ALL.find(x=>x.id===flow.spec);
    if (!sp){ $('#pickWarn').hidden=false; sel && sel.focus(); return; }
    startQuiz(flow.mode, sp.name, shuffle(sp.q).slice(0,flow.count));
  };
}

function startQuiz(mode, title, qs){
  quiz = { mode, title, idx:0, start:Date.now(),
    items: qs.map(q=>{ const order = shuffle([0,1,2,3].slice(0,q[1].length)); return {id:q.id, q:q[0], opts:order.map(i=>q[1][i]), ans:order.indexOf(q[2]), why:q[3]}; }),
    picks: [], want: flow.count, limit: mode==='tests' ? qs.length*60 : 0 };
  view='quiz'; render(); window.scrollTo({top:0});
  if (quiz.limit){ tick = setInterval(()=>{ const el=$('#tleft'); const left = quiz.limit - Math.floor((Date.now()-quiz.start)/1000); if (left<=0){ finish(); return; } if(el) el.textContent = mmss(left); }, 1000); }
}
const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function vQuiz(){
  const it = quiz.items[quiz.idx], n = quiz.items.length, pick = quiz.picks[quiz.idx];
  const train = quiz.mode!=='tests', revealed = train && pick!==undefined;
  const isFav = S.fav.includes(it.id);
  const left = quiz.limit ? quiz.limit - Math.floor((Date.now()-quiz.start)/1000) : 0;
  return `
  <div class="stack" style="gap:8px">
    <p class="crumbs">${train?'التدريب':'الاختبار'} · ${esc(quiz.title)}</p>
    <div class="qhead"><span>السؤال ${quiz.idx+1} من ${n}</span>${quiz.limit?`<span class="timer">${ic('clock')}<span id="tleft">${mmss(Math.max(0,left))}</span></span>`:`<span>${quiz.picks.filter((p,i)=>p===quiz.items[i].ans).length} إجابة صحيحة</span>`}</div>
    <div class="progress" aria-hidden="true"><i style="width:${(quiz.idx+1)/n*100}%"></i></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px"><button class="star ${isFav?'on':''}" type="button" id="favBtn" aria-pressed="${isFav}">${ic('star')}${isFav?'في المفضلة':'أضيفي للمفضلة'}</button></div>
    <p class="qtext"${dir(it.q)}>${esc(it.q)}</p>
    <div class="opts">${it.opts.map((o,i)=>{
      let cls=''; if (revealed){ if(i===it.ans) cls='right'; else if(i===pick) cls='wrong'; } else if (i===pick) cls='sel';
      return `<button class="opt ${cls}" type="button" data-opt="${i}" ${revealed?'disabled':''}><span class="k">${letters[i]}</span><span${dir(o)} style="flex:1;min-width:0${isLatin(o)?';text-align:left':''}">${esc(o)}</span></button>`; }).join('')}</div>
    ${revealed?`<div class="why"><b>${pick===it.ans?'إجابة صحيحة.':'الإجابة الصحيحة: '+esc(it.opts[it.ans])}</b><br><span${dir(it.why)}>${esc(it.why)}</span></div>`:''}
  </div>
  <div class="qnav">
    <button class="btn btn-outline" type="button" id="prevQ" ${quiz.idx===0?'disabled':''}>السابق</button>
    ${quiz.idx<n-1
      ? `<button class="btn btn-primary" type="button" id="nextQ" ${train&&pick===undefined?'disabled':''}>التالي</button>`
      : `<button class="btn btn-primary" type="button" id="finishQ">${ic('check')} إنهاء وعرض النتيجة</button>`}
  </div>
  ${!train?`<p class="sub" style="color:var(--muted);text-align:center">أجبتِ عن ${quiz.picks.filter(p=>p!==undefined).length} من ${n}. يمكنك التنقل بين الأسئلة قبل الإنهاء.</p>`:''}`;
}
function bindQuiz(){
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ quiz.picks[quiz.idx]=+b.dataset.opt; render(); });
  const p=$('#prevQ'); if(p) p.onclick=()=>{ quiz.idx--; render(); };
  const nx=$('#nextQ'); if(nx) nx.onclick=()=>{ quiz.idx++; render(); window.scrollTo({top:0}); };
  const f=$('#finishQ'); if(f) f.onclick=finish;
  $('#favBtn').onclick=()=>{ const id=quiz.items[quiz.idx].id; S.fav = S.fav.includes(id)? S.fav.filter(x=>x!==id) : [...S.fav,id]; save(); render(); };
}

function finish(){
  if (tick){ clearInterval(tick); tick=null; }
  const items = quiz.items, n = items.length;
  const right = items.filter((it,i)=>quiz.picks[i]===it.ans).length;
  const pct = Math.round(right/n*100);
  items.forEach((it,i)=>{ if (quiz.picks[i]===it.ans) S.wrong = S.wrong.filter(x=>x!==it.id); else if (!S.wrong.includes(it.id)) S.wrong.push(it.id); });
  S.results.unshift({t:Date.now(), title:quiz.title, mode:quiz.mode, right, n, pct, secs:Math.round((Date.now()-quiz.start)/1000)});
  S.results = S.results.slice(0,50); save();
  quiz.done = {right, n, pct}; view='result'; render(); window.scrollTo({top:0});
}

function ring(pct){
  const r=60, c=2*Math.PI*r, col = pct>=80?'var(--good)':pct>=50?'var(--teal)':'var(--bad)';
  return `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="النتيجة ${pct}٪"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="14"/><circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 75 75)"/><text x="75" y="84" text-anchor="middle" font-family="Readex Pro, sans-serif" font-size="30" font-weight="700" fill="var(--ink)">${pct}٪</text></svg>`;
}
function vResult(){
  const {right,n,pct} = quiz.done;
  const lvl = pct>=80?['good','ممتاز، أنتِ جاهزة في هذا المسار']:pct>=50?['mid','جيد، راجعي الأسئلة الخاطئة']:['bad','تحتاجين مزيدًا من التدريب'];
  return `
  <div class="card result-top">
    <p class="crumbs">${esc(quiz.title)}</p>
    ${ring(pct)}
    <h1 style="font-size:1.4rem">${right} إجابة صحيحة من ${n}</h1>
    <span class="pill ${lvl[0]}">${lvl[1]}</span>
    <div class="acts" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px">
      <button class="btn btn-primary" type="button" id="again">إعادة بأسئلة جديدة</button>
      ${n-right?`<button class="btn btn-outline" type="button" data-go="wrong">التدريب على أخطائي</button>`:''}
      <button class="btn btn-outline" type="button" data-go="home">الرئيسية</button>
    </div>
  </div>
  <section class="stack"><h2>مراجعة الإجابات</h2>
  ${quiz.items.map((it,i)=>{ const p=quiz.picks[i], ok=p===it.ans; return `<div class="card rev ${ok?'ok':'no'} stack" style="gap:6px">
    <p class="q"${dir(it.q)}>${i+1}. ${esc(it.q)}</p>
    <p class="a">إجابتك: <b>${p===undefined?'لم تُجيبي':esc(it.opts[p])}</b>${ok?' ✓':''}</p>
    ${ok?'':`<p class="a">الصحيحة: <b style="color:var(--good)">${esc(it.opts[it.ans])}</b></p>`}
    <p class="a"${dir(it.why)}>${esc(it.why)}</p></div>`; }).join('')}
  </section>`;
}
function bindResult(){ const a=$('#again'); if(a) a.onclick=()=>{ if (quiz.src){ startQuiz(quiz.mode, quiz.title, shuffle(quiz.src)); return; } const sp=ALL.find(x=>x.name===quiz.title); if (sp) startQuiz(quiz.mode, sp.name, shuffle(sp.q).slice(0,quiz.want||quiz.items.length)); else go('home'); }; }

function qList(ids, emptyMsg, title, practiceLabel){
  const qs = ids.map(findQ).filter(Boolean);
  if (!qs.length) return `<div class="card empty">${emptyMsg}</div>`;
  return `<button class="btn btn-primary" type="button" id="practiceList" style="align-self:flex-start">${ic('book')} ${practiceLabel} (${qs.length})</button>
  ${qs.map(q=>bankItem(q, true)).join('')}`;
}
function bankItem(q, showSpec){
  const fav = S.fav.includes(q.id);
  return `<details class="bq"><summary${dir(q[0])}>${esc(q[0])}${showSpec?`<br><span style="font-weight:400;font-size:.85rem;color:var(--muted)">${specName(q.spec)}</span>`:''}</summary><div class="body">
    ${q[1].map((o,i)=>`<span${dir(o)} class="${i===q[2]?'ans':''}">${letters[i]}) ${esc(o)}${i===q[2]?' ✓':''}</span>`).join('')}
    <span style="color:var(--muted)"${dir(q[3])}>${esc(q[3])}</span>
    <button class="star ${fav?'on':''}" type="button" data-fav="${q.id}" style="align-self:flex-start">${ic('star')}${fav?'إزالة من المفضلة':'أضيفي للمفضلة'}</button></div></details>`;
}
function bindLists(src, title){
  app.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{ const id=b.dataset.fav; S.fav = S.fav.includes(id)? S.fav.filter(x=>x!==id):[...S.fav,id]; save(); const open=[...app.querySelectorAll('details[open]')].map(d=>d.querySelector('[data-fav]').dataset.fav); render(); app.querySelectorAll('details').forEach(d=>{ const f=d.querySelector('[data-fav]'); if(f&&open.includes(f.dataset.fav)) d.open=true; }); });
  const pl=$('#practiceList'); if(pl && src) pl.onclick=()=>{ const qs=src().map(findQ).filter(Boolean); startQuiz('train', title, shuffle(qs)); quiz.src = qs; };
}

let bankSpec='all', bankText='';
function vBank(){
  const pool = (bankSpec==='all'?ALL:ALL.filter(s=>s.id===bankSpec)).flatMap(s=>s.q);
  const t = bankText.trim();
  const qs = t ? pool.filter(q=>(q[0]+' '+q[1].join(' ')).toLowerCase().includes(t.toLowerCase())) : pool;
  return `${backBtn('home')}
  <div class="stack" style="gap:4px"><h1>بنك الأسئلة</h1><p style="color:var(--muted)">تصفحي الأسئلة مع الإجابة والشرح. اضغطي على السؤال لعرض الخيارات.</p></div>
  <div class="field"><label for="bankQ">ابحثي في الأسئلة</label><input class="search" id="bankQ" type="search" placeholder="مثال: بياجيه، الكسور، التنوين" value="${esc(bankText)}"></div>
  <div class="field"><label for="bankSel">التخصص</label><div class="selectbox"><select id="bankSel">${[['all','جميع التخصصات'],...ALL.map(s=>[s.id,s.id==='general'?'التربوي العام':s.name])].map(([id,nm])=>`<option value="${id}" ${bankSpec===id?'selected':''}>${nm}</option>`).join('')}</select></div></div>
  <p class="sub" style="color:var(--muted)">${qs.length} سؤالًا</p>
  <div class="stack" style="gap:10px">${qs.length?qs.map(q=>bankItem(q, bankSpec==='all')).join(''):'<div class="card empty">لا توجد أسئلة مطابقة لبحثك.</div>'}</div>`;
}
function bindBank(){
  $('#bankSel').onchange=e=>{ bankSpec=e.target.value; render(); };
  const i=$('#bankQ'); i.oninput=()=>{ bankText=i.value; const pos=i.selectionStart; render(); const j=$('#bankQ'); j.focus(); try{j.setSelectionRange(pos,pos);}catch(e){} };
  bindLists(null);
}

function vResults(){
  const R = S.results;
  if (!R.length) return `${backBtn('home')}<h1>النتائج / لوحتي</h1><div class="card empty">لم تُكملي أي اختبار بعد. ابدئي <button class="btn btn-outline" type="button" data-go="tests" style="margin-top:12px">اختبارًا تجريبيًا</button></div>`;
  const avg = Math.round(R.reduce((a,r)=>a+r.pct,0)/R.length);
  const bySpec = {}; R.forEach(r=>{ (bySpec[r.title] ||= []).push(r.pct); });
  const rows = Object.entries(bySpec).map(([k,v])=>[k, Math.round(v.reduce((a,b)=>a+b,0)/v.length), v.length]).sort((a,b)=>b[1]-a[1]);
  return `${backBtn('home')}
  <h1>النتائج / لوحتي</h1>
  <div class="grid3">
    <div class="card"><div class="stat">${R.length}</div><p class="sub">اختبارات مكتملة</p></div>
    <div class="card"><div class="stat">${avg}٪</div><p class="sub">متوسط الدرجات</p></div>
    <div class="card"><div class="stat">${S.wrong.length}</div><p class="sub">سؤالًا في «أخطائي»</p></div>
  </div>
  <section class="stack"><h2>الأداء حسب المسار</h2>
    <div class="card stack" style="gap:12px">${rows.map(([k,p,c])=>`<div class="stack" style="gap:4px"><div class="qhead"><span style="color:var(--ink)">${esc(k)}</span><span>${p}٪ · ${c} ${c===1?'محاولة':'محاولات'}</span></div><div class="progress"><i style="width:${p}%;background:${p>=80?'var(--good)':p>=50?'var(--teal)':'var(--bad)'}"></i></div></div>`).join('')}</div>
  </section>
  <section class="stack"><h2>سجل المحاولات</h2>
    <div class="card table-wrap"><table><thead><tr><th>التاريخ</th><th>المسار</th><th>النوع</th><th>الدرجة</th></tr></thead><tbody>
    ${R.map(r=>`<tr><td>${fmtDate(r.t)}</td><td>${esc(r.title)}</td><td>${r.mode==='tests'?'اختبار':'تدريب'}</td><td><b>${r.right}/${r.n}</b> (${r.pct}٪)</td></tr>`).join('')}
    </tbody></table></div>
    <button class="btn btn-outline" type="button" id="clearRes" style="align-self:flex-start">مسح السجل</button>
    <p id="clearConfirm" hidden class="notice">${ic('alert')}<span>سيُحذف سجل النتائج من هذا الجهاز. <button class="btn btn-primary" type="button" id="clearYes" style="padding:6px 14px;margin-inline-start:8px">تأكيد المسح</button></span></p>
  </section>`;
}
function bindResults(){ const c=$('#clearRes'); if(c) c.onclick=()=>{ $('#clearConfirm').hidden=false; }; const y=$('#clearYes'); if(y) y.onclick=()=>{ S.results=[]; save(); render(); }; }

function vAccount(){
  return `${backBtn('home')}
  <h1>حسابي</h1>
  <div class="card stack">
    <div class="field"><label for="tName">اسم المعلمة</label><input id="tName" type="text" value="${esc(S.name)}" placeholder="اكتبي اسمك"></div>
    <button class="btn btn-primary" type="button" id="saveName" style="align-self:flex-start">حفظ</button>
    <p class="sub" id="savedMsg" hidden style="color:var(--good)">تم الحفظ.</p>
  </div>
  <div class="notice">${ic('info')}<span>تُحفظ نتائجك ومفضلتك وأخطاؤك على هذا الجهاز وهذا المتصفح فقط، ولا يراها أحد غيرك.</span></div>`;
}
function bindAccount(){ $('#saveName').onclick=()=>{ S.name=$('#tName').value.trim(); save(); $('#savedMsg').hidden=false; }; }

function render(){
  let html='';
  if (view==='home') html=vHome();
  else if (view==='train'||view==='tests') html=vFlow();
  else if (view==='quiz') html=vQuiz();
  else if (view==='result') html=vResult();
  else if (view==='bank') html=vBank();
  else if (view==='fav') html=`${backBtn('home')}<div class="stack" style="gap:4px"><h1>المفضلة</h1><p style="color:var(--muted)">الأسئلة التي حفظتِها أثناء التدريب أو من بنك الأسئلة.</p></div>${qList(S.fav,'لا توجد أسئلة في المفضلة بعد. اضغطي على النجمة بجانب أي سؤال لحفظه.','المفضلة','تدرّبي على المفضلة')}`;
  else if (view==='wrong') html=`${backBtn('home')}<div class="stack" style="gap:4px"><h1>أخطائي</h1><p style="color:var(--muted)">كل سؤال تخطئين فيه يُضاف هنا، ويُحذف عندما تجيبين عنه إجابة صحيحة.</p></div>${qList(S.wrong,'لا توجد أخطاء مسجلة. أحسنتِ!','أخطائي','تدرّبي على أخطائي')}`;
  else if (view==='results') html=vResults();
  else if (view==='account') html=vAccount();
  app.innerHTML = html;
  if (S.name && view==='home'){ const h=app.querySelector('.hero .eyebrow'); if(h) h.textContent = 'أهلًا '+S.name+' · نحو تعليم أكثر جودة وتميزًا'; }
  if (view==='train'||view==='tests') bindFlow();
  if (view==='quiz') bindQuiz();
  if (view==='result') bindResult();
  if (view==='bank') bindBank();
  if (view==='fav') bindLists(()=>S.fav,'المفضلة');
  if (view==='wrong') bindLists(()=>S.wrong.slice(),'أخطائي');
  if (view==='results') bindResults();
  if (view==='account') bindAccount();
  renderMenu();
}
render();
</script>

</body>
</html>
